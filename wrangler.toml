name = "flytripvisa"
main = "src/index.ts"
compatibility_date = "2026-09-11"

D1 Database binding

[[d1_databases]]
binding = "DB"
database_name = "flytripvisa_db"
database_id = "YOUR_D1_DB_ID"

Static files

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

Environment variables

Set secrets with:

wrangler secret put JWT_SECRET

wrangler secret put TG_BOT_TOKEN

wrangler secret put TG_CHAT_ID

wrangler secret put SMTP_TO