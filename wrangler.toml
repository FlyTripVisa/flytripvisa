name = "flytripvisa"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "flytripvisa_db"
database_id = "YOUR_D1_DB_ID"

# Environment variables (set via: wrangler secret put NAME)
# JWT_SECRET
# TG_BOT_TOKEN
# TG_CHAT_ID
# SMTP_TO = visa@flytripvisa.site

[assets]
directory = "./public"
binding = "ASSETS"

# For Pages-style static hosting, use:
# [site]
# bucket = "./public"
