<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="FlyTripVisa AI Chat">
  <title>FlyTripVisa AI</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div>
          <strong>FlyTripVisa</strong>
          <span>AI Assistant</span>
        </div>
      </div>

      <button class="new-chat" id="newChatBtn">＋ New chat</button>

      <div class="sidebar-section">
        <div class="sidebar-label">Recent chats</div>
        <div id="chatList" class="chat-list"></div>
      </div>

      <div class="sidebar-bottom">
        <div class="status" id="status">
          <span class="status-dot"></span>
          <span>Ready</span>
        </div>
        <button class="ghost-btn" id="clearHistoryBtn">Clear history</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="model-title">
          <strong>FlyTripVisa AI</strong>
          <span id="modelBadge">Muse</span>
        </div>
        <button class="icon-btn" id="newChatTop" aria-label="New chat">＋</button>
      </header>

      <section class="chat-shell">
        <div id="messages" class="messages"></div>

        <div id="typing" class="typing hidden">
          <span></span><span></span><span></span>
        </div>

        <form id="composer" class="composer">
          <textarea id="prompt" rows="1" placeholder="Message FlyTripVisa AI…" autocomplete="off"></textarea>
          <button id="sendBtn" class="send-btn" type="submit" aria-label="Send">↑</button>
        </form>

        <div class="composer-note">
          AI can make mistakes. Verify important visa, travel and booking information.
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
