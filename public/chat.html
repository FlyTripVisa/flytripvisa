<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyTripVisa | Fly AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<header class="admin-header">
  <div class="logo">Fly<span>Trip</span>Visa · AI</div>
</header>

<div class="chat-shell">
  <div class="chat-log" id="chatLog">
    <div class="chat-msg ai">✨ Hi! I'm Fly AI. Ask me anything about visas.</div>
  </div>
  <form class="chat-form" id="chatForm">
    <input type="text" id="chatInput" placeholder="Ask me..." autocomplete="off">
    <button type="submit"><i class="fas fa-paper-plane"></i></button>
  </form>
</div>

<script>
const log = document.getElementById('chatLog');
const form = document.getElementById('chatForm');
const input = document.getElementById('chatInput');

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  const typing = document.createElement('div');
  typing.className = 'chat-msg ai';
  typing.textContent = '...';
  log.appendChild(typing);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    typing.textContent = data.reply || 'No response.';
  } catch (err) {
    typing.textContent = '⚠️ Connection error.';
  }
});
</script>
</body>
</html>
