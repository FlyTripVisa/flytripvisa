<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyTripVisa | Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="title">FlyTripVisa Admin</div>
    <form id="loginForm">
      <input class="input" type="text" id="username" placeholder="Username" required>
      <input class="input" type="password" id="password" placeholder="Password" required>
      <div class="error" id="loginError"></div>
      <button type="submit" class="submit-btn">Login</button>
    </form>
  </div>
</div>
<script src="assets/js/admin.js"></script>
</body>
</html>
